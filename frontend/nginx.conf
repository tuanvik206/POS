worker_processes auto;
pid /tmp/nginx.pid;
  error_log /dev/stderr notice;
  error_log /var/log/pos/nginx-error.log notice;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format pos_safe '$remote_addr "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';
  access_log /dev/stdout pos_safe;
  access_log /var/log/pos/nginx-access.log pos_safe;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 1m;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /health {
      default_type text/plain;
      access_log off;
      return 200 "ok\n";
    }
    location = /nginx_status {
      stub_status;
      access_log off;
      allow 127.0.0.1;
      allow 172.16.0.0/12;
      deny all;
    }
    location /api/ {
      proxy_pass http://api:3000/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /metrics {
      proxy_pass http://api:3000/metrics;
      allow 172.16.0.0/12;
      deny all;
    }
    location /phpmyadmin/ {
      proxy_pass http://phpmyadmin:80/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_redirect off;
    }
    location = /phpmyadmin { return 301 /phpmyadmin/; }
    location /grafana/ {
      proxy_pass http://grafana:3000/grafana/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
    location = /grafana { return 301 /grafana/; }
    location /prometheus/ {
      proxy_pass http://prometheus:9090/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /prometheus { return 301 /prometheus/; }
    location / {
      # Nginx replaces inherited add_header directives when a location defines
      # its own, so repeat the common headers here alongside the SPA CSP.
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
