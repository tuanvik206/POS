name: ${COMPOSE_PROJECT_NAME:-pos-store}

services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
      grafana:
        condition: service_started
      phpmyadmin:
        condition: service_started
    networks:
      - edge
      - app
      - observability
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0750
      - /var/run:uid=101,gid=101,mode=0750
      - /tmp:uid=101,gid=101,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 100

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:?Run npm run setup first}
      DB_USER: ${MYSQL_USER:?Run npm run setup first}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Run npm run setup first}
      JWT_SECRET: ${JWT_SECRET:?Run npm run setup first}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run npm run setup first}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app
      - data
      - observability
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 4s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 100
    mem_limit: 384m
    cpus: 1.0

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Run npm run setup first}
      MYSQL_USER: ${MYSQL_USER:?Run npm run setup first}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run npm run setup first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run npm run setup first}
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?Run npm run setup first}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data
      - metrics
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop: [NET_RAW, SYS_PTRACE]
    pids_limit: 300
    mem_limit: 768m

  phpmyadmin:
    image: phpmyadmin:5-apache
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: http://localhost:${APP_PORT:-8080}/phpmyadmin/
      UPLOAD_LIMIT: 16M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app
      - data
    security_opt:
      - no-new-privileges:true
    cap_drop: [NET_RAW, SYS_PTRACE]
    pids_limit: 100

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.external-url=/prometheus/
      - --web.route-prefix=/
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - observability
      - metrics
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 100

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: http://localhost:${APP_PORT:-8080}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run npm run setup first}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 150

  loki:
    image: grafana/loki:3.5.0
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./observability/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 100

  promtail:
    image: grafana/promtail:3.5.0
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./observability/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail-data:/var/promtail
    depends_on:
      - loki
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 100

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 200
    mem_limit: 384m
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - metrics

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --web.listen-address=:9100
    volumes:
      - /:/host:ro
    networks:
      - metrics
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    restart: unless-stopped
    command: ["--nginx.scrape-uri=http://web:8080/nginx_status"]
    depends_on:
      - web
    networks:
      - edge
      - metrics

  mysql-exporter:
    image: prom/mysqld-exporter:v0.17.2
    restart: unless-stopped
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?Run npm run setup first}
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=exporter
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - data
      - metrics

networks:
  edge: {}
  app:
    internal: true
  data:
    internal: true
  metrics:
    internal: true
  observability:
    internal: true

volumes:
  mysql-data:
  prometheus-data:
  grafana-data:
  loki-data:
  promtail-data:
