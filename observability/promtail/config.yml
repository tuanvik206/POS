server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/promtail/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: pos-api
    static_configs:
      - targets: [localhost]
        labels:
          job: pos-api
          __path__: /var/log/pos/api.jsonl
    pipeline_stages:
      - json:
          expressions:
            level: level
      - labels:
          level:
  - job_name: pos-nginx-access
    static_configs:
      - targets: [localhost]
        labels:
          job: pos-nginx-access
          __path__: /var/log/pos/nginx-access.log
  - job_name: pos-nginx-error
    static_configs:
      - targets: [localhost]
        labels:
          job: pos-nginx-error
          __path__: /var/log/pos/nginx-error.log
