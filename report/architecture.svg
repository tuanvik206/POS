<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Kiến trúc hệ thống POS Store</title>
  <desc id="desc">Trình duyệt truy cập Nginx; Nginx định tuyến tới giao diện và các dịch vụ; API lưu dữ liệu trong MySQL; Prometheus, Grafana, Loki và Promtail giám sát hệ thống.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#0f172a}.title{font-size:27px;font-weight:700}.sub{font-size:14px;fill:#475569}.group{font-size:14px;font-weight:700;letter-spacing:1px;fill:#64748b}.node{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:14}.edge{fill:#eff6ff;stroke:#93c5fd}.data{fill:#f0fdf4;stroke:#86efac}.obs{fill:#f5f3ff;stroke:#c4b5fd}.logs{fill:#fff7ed;stroke:#fdba74}.name{font-size:17px;font-weight:700}.detail{font-size:12px;fill:#475569}.route{font-size:12px;font-weight:600;fill:#2563eb}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.lineBlue{fill:none;stroke:#2563eb;stroke-width:2;marker-end:url(#arrowBlue)}
    </style>
  </defs>
  <rect width="1200" height="680" rx="22" fill="#f8fafc"/>
  <text class="title" x="42" y="48">POS Store · Kiến trúc triển khai</text>
  <text class="sub" x="42" y="74">Docker Compose · mạng được phân đoạn · các cổng ứng dụng đi qua Nginx</text>
  <text class="group" x="42" y="116">ỨNG DỤNG VÀ DỮ LIỆU</text>
  <rect class="node" x="42" y="145" width="150" height="72"/>
  <text class="name" x="117" y="175" text-anchor="middle">Trình duyệt</text><text class="detail" x="117" y="196" text-anchor="middle">127.0.0.1:8081</text>
  <rect class="node edge" x="250" y="140" width="185" height="82"/>
  <text class="name" x="342" y="174" text-anchor="middle">Nginx</text><text class="detail" x="342" y="198" text-anchor="middle">reverse proxy · security headers</text>
  <rect class="node edge" x="500" y="112" width="190" height="64"/>
  <text class="name" x="595" y="141" text-anchor="middle">React + TypeScript</text><text class="detail" x="595" y="161" text-anchor="middle">SPA tĩnh</text>
  <rect class="node edge" x="500" y="203" width="190" height="76"/>
  <text class="name" x="595" y="236" text-anchor="middle">Express API</text><text class="detail" x="595" y="260" text-anchor="middle">JWT · transaction · /metrics</text>
  <rect class="node edge" x="500" y="307" width="190" height="64"/>
  <text class="name" x="595" y="336" text-anchor="middle">phpMyAdmin</text><text class="detail" x="595" y="356" text-anchor="middle">UI quản trị database</text>
  <rect class="node data" x="790" y="229" width="185" height="82"/>
  <text class="name" x="882" y="263" text-anchor="middle">MySQL 8.4</text><text class="detail" x="882" y="287" text-anchor="middle">volume bền vững · không publish port</text>
  <path class="line" d="M192 181H247"/><path class="line" d="M435 160L497 145"/><path class="line" d="M435 184L497 240"/><path class="line" d="M435 202L497 337"/>
  <path class="line" d="M690 241L787 266"/><path class="line" d="M690 338L787 287"/>
  <text class="route" x="454" y="132">/</text><text class="route" x="456" y="211">/api</text><text class="route" x="450" y="302">/phpmyadmin</text>
  <text class="group" x="42" y="415">GIÁM SÁT VÀ LOG</text>
  <rect class="node obs" x="250" y="444" width="190" height="78"/>
  <text class="name" x="345" y="478" text-anchor="middle">Prometheus</text><text class="detail" x="345" y="502" text-anchor="middle">scrape metrics mỗi 15 giây</text>
  <rect class="node obs" x="500" y="425" width="190" height="74"/>
  <text class="name" x="595" y="457" text-anchor="middle">Exporters</text><text class="detail" x="595" y="480" text-anchor="middle">cAdvisor · Node · Nginx · MySQL</text>
  <rect class="node obs" x="250" y="555" width="190" height="70"/>
  <text class="name" x="345" y="584" text-anchor="middle">Grafana</text><text class="detail" x="345" y="606" text-anchor="middle">dashboard Prometheus + Loki</text>
  <rect class="node logs" x="500" y="535" width="190" height="70"/>
  <text class="name" x="595" y="564" text-anchor="middle">pos-logs volume</text><text class="detail" x="595" y="586" text-anchor="middle">API JSONL + Nginx access/error</text>
  <rect class="node logs" x="790" y="535" width="170" height="70"/>
  <text class="name" x="875" y="564" text-anchor="middle">Promtail</text><text class="detail" x="875" y="586" text-anchor="middle">chỉ mount volume ở chế độ ro</text>
  <rect class="node obs" x="1010" y="535" width="150" height="70"/>
  <text class="name" x="1085" y="564" text-anchor="middle">Loki</text><text class="detail" x="1085" y="586" text-anchor="middle">lưu log · retention 7 ngày</text>
  <path class="lineBlue" d="M595 279V400H345V441"/><path class="lineBlue" d="M882 311V397H595V422"/><path class="lineBlue" d="M690 459H737"/>
  <path class="line" d="M690 570H787"/><path class="line" d="M960 570H1007"/><path class="line" d="M345 552V522"/><path class="line" d="M440 570H470V405H1085V532"/>
  <path class="line" d="M345 222V438"/><text class="route" x="351" y="402">/nginx_status</text>
  <text class="sub" x="42" y="652">Docker networks: edge · app · data · metrics · observability (internal khi phù hợp)</text>
</svg>
